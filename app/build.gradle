plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jin.freeze'
    compileSdk 35

    defaultConfig {
        applicationId "com.jin.freeze"
        minSdk 24
        targetSdk 34
        versionCode 192
        versionName "2.10.22"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // Shizuku UserService 需要 AIDL 接口（IJinLite）
        aidl true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 无 root 时通过 Shizuku 执行 pm 冻结/解冻（12.2.0 仍公开 newProcess）
    implementation 'dev.rikka.shizuku:api:12.2.0'
    implementation 'dev.rikka.shizuku:provider:12.2.0'
    // 无 root/Shizuku 时通过 Dhizuku（Device Owner 代理）暂停/恢复应用。
    // 原库 Dhizuku-API 由 Java 21 编译（class 头 65.0），javac 17 读不了，
    // 故用 class 头降级副本（libs/dhizuku-api-2.5.4-cp.jar，只改版本号不动字节码）；
    // 原 AAR 的 manifest 片段（API 权限 + queries）已并入 AndroidManifest.xml，
    // AAR 的 proguard 规则已并入 proguard-rules.pro
    implementation files('libs/dhizuku-api-2.5.4-cp.jar')
    // 隐藏 API 豁免：SuspendDialogInfo 的 binder 通道要用 $Stub.TRANSACTION_* 常量（非 SDK 字段）
    implementation fileTree(dir: 'libs', include: ['hiddenapibypass-6.1.jar'])
    // LSPosed 模块接口：只在 LSPosed 注入的 system_server 里加载，应用自身不引用（compileOnly 不打包）
    compileOnly fileTree(dir: 'libs', include: ['libxposed-api-102.jar', 'libxposed-interface-102.jar'])
    // 隐藏类桩：TaskStackListener（照 Thanox lite 直接继承它注册划卡回调），运行时用系统实现
    compileOnly files('libs/framework-stubs.jar')
}
